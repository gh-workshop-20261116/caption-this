<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Exercise</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #18004d; color: white; text-align: center; }
    header { padding: 35px 20px 20px; }
    h1 { margin-bottom: 8px; color: #65f6e8; }
    main { max-width: 900px; margin: auto; padding: 0 20px 40px; }
    img { width: 100%; border-radius: 14px; box-shadow: 0 8px 30px #0008; }
    .card { margin-top: 24px; padding: 20px; background: #ffffff15; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Get Schwifty</h1>
    <p>Show us what you got!.</p>
  </header>
  <main>
    <img src="rick-and-morty.jpg" alt="Colourful cartoon artwork">
    <div class="card">
      <h2>Aloha!</h2>
      <p>If you can see this page and the image, great</p>
    </div>
  </main>
</body>
</html>
